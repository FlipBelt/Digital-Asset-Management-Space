server {
    listen 80 default_server;
    server_name "";

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name jtzhzt.flipbeltchina.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name jtzhzt.flipbeltchina.com;

    ssl_certificate /etc/letsencrypt/live/jtzhzt.flipbeltchina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jtzhzt.flipbeltchina.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/account-center;
    index index.html;
    client_max_body_size 10m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite uses `/assets/` for hashed static files, while the SPA also uses
    # the exact `/assets` path for the asset-center route.  Keep the exact
    # route in the SPA and let `/assets/<hashed-file>` continue as static.
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    # Isolated scenario-test application.  The trailing slash on proxy_pass
    # strips `/test-api/` before forwarding, so the test backend still serves
    # its normal `/api/v1/...` contract.  Production `/api/` stays untouched.
    location = /test {
        return 301 /test/;
    }

    location ^~ /test-api/ {
        proxy_pass http://127.0.0.1:8200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /test/ {
        root /var/www;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /test/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standalone developer control plane. The backend applies the dedicated
    # role and server allowlist; this path deliberately stays out of the SPA.
    location = /developer/control-plane {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # DingTalk PC may retain the micro-app entry page aggressively.  Keep
        # the SPA shell revalidating so a new hashed bundle is discovered on
        # each app launch; Vite assets themselves remain hash-versioned.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
