server {
    listen 80 default_server;
    server_name "";

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name jtzhzt.flipbeltchina.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name jtzhzt.flipbeltchina.com;

    ssl_certificate /etc/letsencrypt/live/jtzhzt.flipbeltchina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jtzhzt.flipbeltchina.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/account-center;
    index index.html;
    client_max_body_size 30m;

    # Independent remote MCP and OAuth. Neither endpoint falls through to the SPA.
    location = /mcp {
        proxy_pass http://127.0.0.1:8100/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /mcp-oauth/ {
        access_log off;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy no-referrer always;
    }

    location ^~ /test-api/mcp-oauth/ {
        access_log off;
        proxy_pass http://127.0.0.1:8200/mcp-oauth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy no-referrer always;
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8100/.well-known/oauth-protected-resource;
        proxy_set_header Host $host;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:8100/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
    }
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:8100/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
    }
    location = /.well-known/oauth-authorization-server/mcp-oauth {
        proxy_pass http://127.0.0.1:8100/.well-known/oauth-authorization-server/mcp-oauth;
        proxy_set_header Host $host;
    }
    # RFC 8414 inserts the well-known segment before the issuer path.
    location = /.well-known/oauth-authorization-server/test-api/mcp-oauth {
        proxy_pass http://127.0.0.1:8200/.well-known/oauth-authorization-server/mcp-oauth;
        proxy_set_header Host $host;
    }
    location = /.well-known/oauth-protected-resource/test-api/mcp {
        proxy_pass http://127.0.0.1:8200/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
    }
    # Pending consent handles are never written to access logs or referrers.
    location ^~ /agent/oauth {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }
    location ^~ /test/agent/oauth {
        root /var/www;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /test/index.html =404;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite uses `/assets/` for hashed static files, while the SPA also uses
    # the exact `/assets` path for the asset-center route.  Keep the exact
    # route in the SPA and let `/assets/<hashed-file>` continue as static.
    location = /assets {
        rewrite ^ /index.html last;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    # Isolated scenario-test application.  The trailing slash on proxy_pass
    # strips `/test-api/` before forwarding, so the test backend still serves
    # its normal `/api/v1/...` contract.  Production `/api/` stays untouched.
    location = /test {
        return 301 /test/;
    }

    # OAuth callbacks carry a short-lived credential in their query string.
    # Keep business/audit logs, but do not write this callback URL to access logs.
    location = /test-api/api/dingtalk/web/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8200/api/dingtalk/web/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /test-api/ {
        proxy_pass http://127.0.0.1:8200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact SPA route must win over the static assets directory.
    location = /test/assets { rewrite ^ /test/index.html last; }
    location /test/ {
        root /var/www;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /test/index.html;
    }

    # Production OAuth callback carries a short-lived authorization code.
    # Never write its query string to the Nginx access log.
    location = /api/dingtalk/web/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8100/api/dingtalk/web/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standalone developer control plane. The backend applies the dedicated
    # role and server allowlist; this path deliberately stays out of the SPA.
    location = /developer/control-plane {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # DingTalk PC may retain the micro-app entry page aggressively.  Keep
        # the SPA shell revalidating so a new hashed bundle is discovered on
        # each app launch; Vite assets themselves remain hash-versioned.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
