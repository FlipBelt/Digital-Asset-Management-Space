<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle System · Network Prototype</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; background: #0a0e1a; color: #e0e8ff; }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; background: #0a0e1a; color: #e0e8ff; }
    button { font: inherit; }
    button:focus-visible { outline: 1px solid #64c8ff; outline-offset: 3px; }
    .topbar { position: sticky; top: 0; z-index: 5; display: flex; height: 72px; align-items: center; justify-content: space-between; gap: 20px; padding: 0 clamp(18px, 7vw, 110px); border-bottom: 1px solid rgba(255,255,255,.05); background: rgba(10,14,26,.9); backdrop-filter: blur(16px); }
    .back, .kit { color: rgba(224,232,255,.74); font-size: 14px; }
    .back { padding: 9px 15px; border: 1px solid rgba(255,255,255,.05); border-radius: 999px; background: rgba(255,255,255,.03); cursor: pointer; transition: all .18s ease; }
    .back:hover { color: #e0e8ff; border-color: rgba(100,200,255,.2); box-shadow: 0 0 20px rgba(59,130,246,.12); }
    .nav { display: flex; gap: clamp(16px, 3vw, 42px); color: rgba(224,232,255,.45); font-size: 14px; }
    .nav a { color: inherit; text-decoration: none; transition: color .18s ease; }
    .nav a:hover { color: #64c8ff; }
    .page { width: min(1480px, 100%); margin: 0 auto; padding: 64px clamp(18px, 7vw, 110px) 80px; }
    .eyebrow { margin: 0 0 8px; color: #64c8ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 60px); letter-spacing: -.04em; }
    .intro { max-width: 660px; margin: 14px 0 38px; color: rgba(224,232,255,.5); font-size: 15px; line-height: 1.75; }
    .network-card { position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.05); border-radius: 14px; background: rgba(15,20,25,.8); box-shadow: 0 0 40px rgba(59,130,246,.1); backdrop-filter: blur(18px); }
    .network-card::before { position: absolute; inset: 0; pointer-events: none; content: ""; background: radial-gradient(circle at 50% 48%, rgba(59,130,246,.07), transparent 42%); }
    .network-head { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.05); }
    .view-tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid rgba(255,255,255,.05); border-radius: 10px; background: rgba(255,255,255,.025); }
    .view-tabs button { min-height: 32px; padding: 0 14px; border: 0; border-radius: 8px; color: rgba(224,232,255,.45); background: transparent; cursor: pointer; transition: all .18s ease; }
    .view-tabs button:hover { color: rgba(224,232,255,.74); background: rgba(255,255,255,.04); }
    .view-tabs button.active { color: #fff; background: #2563eb; box-shadow: 0 0 15px rgba(59,130,246,.22); }
    .live { display: inline-flex; align-items: center; gap: 8px; color: #64ffc8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #64ffc8; box-shadow: 0 0 12px rgba(100,255,200,.9); animation: breathe 2.3s ease-in-out infinite; }
    .network-stage { position: relative; z-index: 1; min-height: 620px; }
    #network { display: block; width: 100%; height: min(66vw, 690px); min-height: 520px; }
    .network-bg { fill: url(#dot-grid); }
    .particle { fill: rgba(224,232,255,.18); animation: drift 13s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .particle.blue { fill: rgba(100,200,255,.48); }
    .particle.teal { fill: rgba(100,255,200,.4); }
    .particle.violet { fill: rgba(167,139,250,.4); }
    .edge { stroke: rgba(100,200,255,.14); stroke-width: 1.35; vector-effect: non-scaling-stroke; transition: stroke .18s ease, stroke-width .18s ease, opacity .18s ease; }
    .edge.active { stroke: #3b82f6; stroke-width: 2.7; opacity: .92; filter: url(#line-glow); }
    .edge.dim { opacity: .16; }
    .node { cursor: pointer; }
    .node:focus, .node:focus-visible { outline: none !important; }
    .node-ring { fill: none; stroke-width: 1.2; stroke-opacity: .2; vector-effect: non-scaling-stroke; transition: stroke .18s ease, stroke-opacity .18s ease, stroke-width .18s ease; }
    .node-halo { fill: none; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity .22s ease, stroke-opacity .22s ease, stroke-width .22s ease; }
    .node-halo-inner { stroke-width: 1.35; stroke-opacity: .74; }
    .node-halo-outer { stroke-width: 1.1; stroke-opacity: .5; }
    .node-core { stroke: none; transition: r .22s ease, fill .18s ease, filter .18s ease; }
    .node-label { fill: rgba(224,232,255,.45); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; text-anchor: middle; transition: fill .18s ease, font-size .18s ease; }
    .node:hover .node-ring { stroke-opacity: .72; stroke-width: 2; }
    .node:hover .node-label { fill: rgba(224,232,255,.72); }
    .node-selected .node-ring { stroke-opacity: 0; stroke-width: 2; }
    .node-selected .node-core { r: 30; filter: url(#core-glow); animation: pulse 2.4s ease-in-out infinite; }
    .node-selected .node-label { fill: #64c8ff; font-size: 15px; transform: translateY(18px); }
    .node-selected .node-halo { opacity: 1; filter: url(#soft-glow); }
    .node-inner-ring { display: none; }
    .network-status { display: flex; align-items: center; gap: 26px; min-height: 62px; padding: 0 22px; border-top: 1px solid rgba(255,255,255,.05); color: rgba(224,232,255,.5); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .network-status strong { color: #64c8ff; font-size: 13px; }
    .network-status b { color: #64ffc8; font-weight: 600; }
    .status-node { display: inline-flex; align-items: center; gap: 10px; }
    .status-node-dot { width: 12px; height: 12px; border-radius: 50%; background: #64c8ff; box-shadow: 0 0 14px rgba(100,200,255,.9); }
    .clear { margin-left: auto; padding: 6px 9px; border: 0; border-radius: 7px; color: rgba(224,232,255,.4); background: transparent; cursor: pointer; transition: all .18s ease; }
    .clear:hover { color: #64c8ff; background: rgba(100,200,255,.08); }
    .hint { margin-top: 14px; color: rgba(224,232,255,.25); font-size: 12px; }
    @keyframes drift { from { transform: translate(0, 0); opacity: .35; } to { transform: translate(7px, -5px); opacity: .85; } }
    @keyframes breathe { 0%,100% { opacity: .48; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes pulse { 0%,100% { opacity: .86; } 50% { opacity: 1; } }
    @media (max-width: 760px) {
      .topbar { height: 60px; padding: 0 16px; }
      .nav { display: none; }
      .page { padding: 34px 14px 46px; }
      .network-head { align-items: flex-start; flex-direction: column; }
      #network { height: 570px; min-height: 0; }
      .network-status { flex-wrap: wrap; gap: 8px 16px; padding: 12px 14px; }
      .clear { margin-left: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="back" type="button">← 回到粒子</button>
    <nav class="nav" aria-label="粒子系统导航"><a href="#network">网络</a><a href="#components">组成部分</a><a href="#colors">颜色</a><a href="#rules">文档</a></nav>
    <span class="kit">风格套件 ›</span>
  </header>
  <main class="page">
    <p class="eyebrow">粒子系统 / 网络可视化</p>
    <h1>生活网络</h1>
    <p class="intro">一个由漂浮粒子和连接线组成的活生生网络。点击任意节点，观察能量如何沿关系路径被激活。</p>
    <section class="network-card" id="network" aria-label="粒子网络原型">
      <div class="network-head">
        <div class="view-tabs" role="tablist" aria-label="网络视图"><button class="active" type="button" role="tab" aria-selected="true">节点</button><button type="button" role="tab" aria-selected="false">边缘</button><button type="button" role="tab" aria-selected="false">流</button></div>
        <div class="live"><span class="live-dot"></span>现场演出 · 7 个节点 / 7 条边</div>
      </div>
      <div class="network-stage">
        <svg id="network" viewBox="0 0 1440 690" role="img" aria-label="可点击的粒子关系网络">
          <defs>
            <pattern id="dot-grid" width="128" height="100" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.4" fill="rgba(224,232,255,.1)" /></pattern>
            <filter id="line-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            <filter id="core-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.2" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          </defs>
          <rect class="network-bg" width="1440" height="690" />
          <g id="particle-layer" aria-hidden="true"></g>
          <g id="edge-layer"></g>
          <g id="node-layer"></g>
        </svg>
      </div>
      <div class="network-status" aria-live="polite"><span class="status-node"><span class="status-node-dot" id="status-dot"></span><span>节点：<strong id="status-name">MiniMax主账号</strong></span></span><span>连接数：<b id="status-degree">3</b></span><span>位置：<b id="status-position">(800, 360)</b></span><span>半径：<b id="status-radius">15</b></span><button class="clear" id="clear" type="button">清场</button></div>
    </section>
    <p class="hint">点击星体激活关系 · 悬停显示能量边界 · 拖动画布和滚轮缩放可在迁移到系统时接入</p>
  </main>
  <script>
    const nodes = [
      { id: "company", label: "杭州飞途行远", x: 420, y: 350, color: "#3b82f6", kind: "blue" },
      { id: "minmax-platform", label: "MinMax", x: 690, y: 190, color: "#a78bfa", kind: "violet" },
      { id: "identity", label: "手机号 · 191068****83", x: 520, y: 535, color: "#94a3b8", kind: "" },
      { id: "minimax-account", label: "MiniMax主账号", x: 800, y: 360, color: "#14b8a6", kind: "teal" },
      { id: "api-service", label: "雯雯_api", x: 1070, y: 505, color: "#60a5fa", kind: "blue" },
      { id: "deepseek-platform", label: "DeepSeek", x: 1100, y: 190, color: "#a78bfa", kind: "violet" },
      { id: "deepseek-account", label: "Deepseek公司账号", x: 1010, y: 350, color: "#14b8a6", kind: "teal" },
    ];
    const edges = [["company", "minmax-platform"], ["company", "deepseek-platform"], ["minmax-platform", "minimax-account"], ["deepseek-platform", "deepseek-account"], ["identity", "minimax-account"], ["identity", "deepseek-account"], ["minimax-account", "api-service"]];
    const particleLayer = document.getElementById("particle-layer");
    for (let i = 0; i < 62; i += 1) {
      const x = 38 + ((i * 197) % 1360), y = 34 + ((i * 113) % 612), r = i % 11 === 0 ? 2.2 : i % 5 === 0 ? 1.6 : 1.1;
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("class", `particle ${i % 13 === 0 ? "blue" : i % 17 === 0 ? "teal" : i % 19 === 0 ? "violet" : ""}`); dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("r", r); dot.style.animationDelay = `${(i % 9) * -1.3}s`; particleLayer.appendChild(dot);
    }
    const nodeById = Object.fromEntries(nodes.map((node) => [node.id, node]));
    const edgeLayer = document.getElementById("edge-layer"), nodeLayer = document.getElementById("node-layer");
    edges.forEach(([source, target], index) => { const a = nodeById[source], b = nodeById[target]; const line = document.createElementNS("http://www.w3.org/2000/svg", "line"); line.id = `edge-${index}`; line.classList.add("edge"); line.setAttribute("x1", a.x); line.setAttribute("y1", a.y); line.setAttribute("x2", b.x); line.setAttribute("y2", b.y); line.dataset.source = source; line.dataset.target = target; edgeLayer.appendChild(line); });
    nodes.forEach((node) => { const group = document.createElementNS("http://www.w3.org/2000/svg", "g"); group.classList.add("node"); group.dataset.id = node.id; group.setAttribute("tabindex", "0"); group.setAttribute("role", "button"); group.setAttribute("aria-label", `激活节点 ${node.label}`); group.style.color = node.color; group.innerHTML = `<circle class="node-ring" cx="${node.x}" cy="${node.y}" r="32" stroke="${node.color}" /><circle class="node-halo node-halo-inner" cx="${node.x}" cy="${node.y}" r="58" stroke="${node.color}" /><circle class="node-halo node-halo-outer" cx="${node.x}" cy="${node.y}" r="80" stroke="${node.color}" /><circle class="node-core" cx="${node.x}" cy="${node.y}" r="15" fill="${node.color}" /><text class="node-label" x="${node.x}" y="${node.y + 56}">${node.label}</text>`; group.addEventListener("click", () => activate(node.id)); group.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); activate(node.id); } }); nodeLayer.appendChild(group); });
    let activeId = "minimax-account";
    function activate(id) { activeId = id; document.querySelectorAll(".node").forEach((node) => node.classList.toggle("node-selected", node.dataset.id === id)); document.querySelectorAll(".edge").forEach((edge) => { const active = edge.dataset.source === id || edge.dataset.target === id; edge.classList.toggle("active", active); edge.classList.toggle("dim", !active); }); const node = nodeById[id], degree = edges.filter(([source, target]) => source === id || target === id).length; document.getElementById("status-name").textContent = node.label; document.getElementById("status-degree").textContent = degree; document.getElementById("status-position").textContent = `(${node.x}, ${node.y})`; document.getElementById("status-radius").textContent = "15"; document.getElementById("status-dot").style.background = node.color; document.getElementById("status-dot").style.boxShadow = `0 0 14px ${node.color}`; }
    document.getElementById("clear").addEventListener("click", () => { activeId = ""; document.querySelectorAll(".node, .edge").forEach((element) => element.classList.remove("node-selected", "active", "dim")); document.getElementById("status-name").textContent = "未选择"; document.getElementById("status-degree").textContent = "0"; document.getElementById("status-position").textContent = "—"; document.getElementById("status-radius").textContent = "—"; });
    document.querySelectorAll(".view-tabs button").forEach((button) => button.addEventListener("click", () => { document.querySelectorAll(".view-tabs button").forEach((item) => { item.classList.remove("active"); item.setAttribute("aria-selected", "false"); }); button.classList.add("active"); button.setAttribute("aria-selected", "true"); }));
    activate(activeId);
  </script>
</body>
</html>
