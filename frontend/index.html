<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/boot.css" />
    <!-- DingTalk JSAPI is loaded lazily only when the application session
         cannot be restored. It must not block the initial SPA render. -->
    <title>FlipBelt 资产中心</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-fallback" role="status">
        <div class="boot-card">
          <img class="boot-fallback-mark" src="/favicon.svg" alt="" />
          <strong data-boot-title>正在打开资产中心</strong>
          <p data-boot-message>正在准备你的工作空间，请稍候。</p>
          <span class="boot-progress" aria-hidden="true"></span>
          <div class="boot-actions" data-boot-actions hidden>
            <button type="button" data-boot-retry>刷新重试</button>
            <a href="%BASE_URL%login">返回登录页</a>
          </div>
        </div>
      </div>
    </div>
    <noscript class="boot-noscript">请在浏览器中启用 JavaScript 后重新打开资产中心。</noscript>
    <script src="/boot-recovery.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
