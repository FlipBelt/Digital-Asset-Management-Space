<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#175ddc" />
    <!-- DingTalk JSAPI is loaded lazily only when the application session
         cannot be restored. It must not block the initial SPA render. -->
    <title>集团账号管理中台</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-fallback" role="status">
        <div class="boot-fallback-mark">集</div>
        <strong>正在加载集团数字资产中心…</strong>
        <span>如果页面长时间没有响应，请刷新或从钉钉工作台重新打开。</span>
      </div>
      <noscript>当前环境需要启用 JavaScript，请从钉钉工作台重新打开。</noscript>
    </div>
    <style>
      .boot-fallback { min-height: 100vh; display: grid; place-content: center; gap: 10px; padding: 24px; color: #18202f; background: #f4f6fb; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      .boot-fallback-mark { width: 42px; height: 42px; margin: 0 auto 4px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: #2563eb; font-weight: 700; }
      .boot-fallback span, noscript { color: #697386; font-size: 12px; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
